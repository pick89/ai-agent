[tool.poetry]
name = "ai-agent"
version = "0.1.0"
description = "Local AI agent with Ollama and Telegram and automate some task"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
ollama = "^0.6.1"
python-telegram-bot = "^22.6"
requests = "^2.32.5"
beautifulsoup4 = "^4.14.3"
duckduckgo-search = "^8.1.1"
httpx = "^0.28.1"
pandas = "^3.0.0"
numpy = "^2.4.2"
matplotlib = "^3.10.8"
python-dotenv = "^1.2.1"
aiohttp = "^3.13.3"
ddgs = "^9.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
black = "^26.1.0"
flake8 = "^7.3.0"
ipython = "^9.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

